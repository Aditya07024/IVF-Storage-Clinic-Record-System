services:
  - type: web
    name: ivf-clinic-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build:backend
    startCommand: npm --prefix apps/backend run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_ACCESS_KEY_HASH
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: '"SRGH IVF Cryo Bank" <srghivfcryo@gmail.com>'
