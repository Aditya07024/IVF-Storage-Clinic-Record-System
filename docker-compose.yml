version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ivf_postgres
    restart: always
    environment:
      POSTGRES_DB: ivf_db
      POSTGRES_USER: ivf_user
      POSTGRES_PASSWORD: ivf_password_secure_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivf_user -d ivf_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ivf_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    container_name: ivf_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://ivf_user:ivf_password_secure_2026@postgres:5432/ivf_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_ACCESS_KEY_HASH: ${APP_ACCESS_KEY_HASH}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
